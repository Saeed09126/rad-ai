<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>RAD AI — دستیار شخصی</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div><strong>RAD AI</strong><small>دستیار شخصی</small></div>
      </div>

      <nav class="nav" aria-label="بخش‌ها">
        <button class="nav-item active" data-view="chat"><span>گفتگو</span></button>
        <button class="nav-item" data-view="tasks"><span>وظایف</span><b id="taskCount">0</b></button>
        <button class="nav-item" data-view="memory"><span>حافظه</span></button>
        <button class="nav-item" data-view="documents"><span>اسناد</span></button>
      </nav>

      <div class="history-panel">
        <div class="section-title"><span>مکالمه‌ها</span><button id="newChat" title="گفتگوی جدید">＋</button></div>
        <div id="chatHistory" class="chat-history"></div>
      </div>

      <button id="themeBtn" class="theme-btn">روشن/تاریک</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" aria-label="منو">☰</button>
        <div>
          <h1 id="viewTitle">گفتگو</h1>
          <p id="statusText">آمادهٔ کمک</p>
        </div>
      </header>

      <section id="chatView" class="view active">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="composer">
          <textarea id="chatInput" rows="1" placeholder="پیام یا دستور خود را بنویسید…" required></textarea>
          <button type="submit" aria-label="ارسال">➤</button>
        </form>
      </section>

      <section id="tasksView" class="view">
        <form id="taskForm" class="task-form">
          <input id="taskInput" placeholder="وظیفهٔ جدید" required>
          <select id="taskPriority"><option value="normal">عادی</option><option value="high">مهم</option><option value="low">کم‌اهمیت</option></select>
          <button type="submit">افزودن</button>
        </form>
        <div id="taskList" class="task-list"></div>
      </section>

      <section id="memoryView" class="view">
        <div class="panel">
          <h2>اطلاعات شخصی</h2>
          <p>این اطلاعات فقط در حافظهٔ همین مرورگر نگهداری می‌شود.</p>
          <form id="memoryForm" class="memory-form">
            <input id="memoryKey" placeholder="عنوان، مثل نام" required>
            <textarea id="memoryValue" placeholder="اطلاعات" required></textarea>
            <button type="submit">ذخیره در حافظه</button>
          </form>
          <div id="memoryList" class="memory-list"></div>
        </div>
      </section>

      <section id="documentsView" class="view">
        <div class="panel">
          <h2>اسناد و فایل‌ها</h2>
          <p>فایل‌های متنی یا سندهای شما در مرورگر ذخیره می‌شوند.</p>
          <label class="file-picker">انتخاب فایل<input id="fileInput" type="file" accept=".txt,.md,.json,.csv,.html,.js,.css"></label>
          <div id="documentList" class="document-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
